setting:
  seed: 20000812
  os_environ:
    WANDB_API_KEY: ~
    WANDB_RUN_ID: ~
    # CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
    MASTER_ADDR: localhost
    MASTER_PORT: 21311
    WORLD_SIZE: 1
    NODE_RANK: 0
  wandb_config:
    project: Pichia-Pastoris
    name: esm2_t33_650M_UR50D

model:
#    Which model to use
  model_py_path: saprot/saprot_binary_classification_model
  kwargs:
#    Arguments to initialize the specific class
    config_path: ../../weights/esm2_t33_650M_UR50D 
    load_pretrained: True
    num_labels: 1

#    Arguments to initialize the basic class AbstractModel
  lr_scheduler_kwargs:
    last_epoch: -1
    init_lr: 2.0e-5
#    Weather to use this scheduler or not
    on_use: false

  optimizer_kwargs:
    betas: [0.9, 0.98]
    weight_decay: 0.01

  save_path: weights/Pichia-Pastoris/train_cv3/fold3/independent_test1-valid_loss/esm2_t33_650M_UR50D.pt  # valid_loss, valid_auc

  teacher_checkpoint: ../1_Teacher/weights/MPB-EXP-adapt/esm2_t33_650M_UR50D.pt  # teacher

dataset:
#    Arguments to initialize the basic class LMDBDataset
  dataset_py_path: saprot/saprot_classification_dataset
  dataloader_kwargs:
    batch_size: 4
    meta_batch_size: 1  
    iters: 8  # 128  #  best to aux_0_4_all: 8
    adapt_steps: 1  # origin: 2
    adapt_batch_size: 1
    eval_batch_size: 1  # origin: 2
    num_workers: 4

  train_lmdb: ../../1_Data/LMDB/Pichia-Pastoris/cls2/train_cv3/fold3/train
  valid_lmdb: ../../1_Data/LMDB/Pichia-Pastoris/cls2/train_cv3/fold3/valid
  test_lmdb: ../../1_Data/LMDB/Pichia-Pastoris/cls2/independent_test1
#    Arguments to initialize the specific class
  kwargs:
    tokenizer: ../../weights/esm2_t33_650M_UR50D  # mark


#  Arguments to initialize Pytorch Lightning Trainer
Trainer:
  max_epochs: 50  # 100, 20
  log_every_n_steps: 1
  strategy:
    find_unused_parameters: True
  logger: False
  enable_checkpointing: false
  check_val_every_n_epoch: 1
  # val_check_interval: 0.5
  accelerator: gpu
  devices: 1
  num_nodes: 1
  accumulate_grad_batches: 1
  precision: 16
  num_sanity_val_steps: 0
